<!doctype html><html lang="de"><head><meta charset="utf-8"><title>VEILORA Neustart</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#05070d;color:#cfe8ff;font:600 16px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}</style></head>
<body><div id="t">Neuer Spielstand wird vorbereitet …</div>
<script>
/* Sichert den Spielstand dieses Browsers (localStorage-Schlüssel sw_save → sw_save_vor_neustart), löscht alle Spieldaten (sw_*) und startet das Spiel wie bei einem neuen Spieler.
   Läuft komplett ohne das Spiel, damit nichts den alten Stand vorher überschreibt. */
(function(){var t=document.getElementById('t'),n=0,gesichert='kein Spielstand vorhanden';
try{var v=localStorage.getItem('sw_save');if(v){localStorage.setItem('sw_save_vor_neustart',v);gesichert='alter Stand gesichert'}
 var ks=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^sw_/.test(k)&&k!=='sw_save_vor_neustart')ks.push(k)}
 ks.forEach(function(k){localStorage.removeItem(k);n++});try{sessionStorage.clear()}catch(e){}
 t.textContent='Fertig: '+gesichert+', '+n+' Einträge geleert. Das Spiel startet neu …';
 setTimeout(function(){location.replace('./')},900)}
catch(e){t.textContent='Fehler: '+e.message}})();
</script></body></html>
